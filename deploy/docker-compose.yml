name: simpeg

# Compose produksi di EC2. Hanya caddy yang membuka port; backend & frontend
# hanya bisa diakses dari jaringan internal Compose.
#
# Interpolasi nilai di bawah dibaca dari environment shell (diisi deploy.sh):
#   APP_DOMAIN, ECR_REGISTRY, TAG
# Variabel aplikasi (DATABASE_URL, JWT_*, dsb.) dibaca container dari
# /opt/simpeg/.env lewat env_file — jangan menaruhnya di file ini.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN wajib diisi}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY wajib diisi}/simpeg-frontend:${TAG:?TAG wajib diisi}
    init: true
    mem_limit: 700m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY wajib diisi}/simpeg-backend:${TAG:?TAG wajib diisi}
    env_file:
      - /opt/simpeg/.env
    init: true
    stop_grace_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
